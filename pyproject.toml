[project]
name = "c2r"
version = "0.1.0"
description = "C-to-Rust translation pipeline with a verified pointer-arithmetic refactoring"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6",
    "openai>=1.40",
    "libclang==18.1.1",
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-rust>=0.24,<0.25",
]

[project.scripts]
c2r = "c2r.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline/c2r"]

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]
